<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CityRideTaxi | Active Ride Tracking</title>
    <link rel="icon" type="image/png" href="car.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Premium CSS -->
    <link rel="stylesheet" href="customer.css?v=2">
    
    <!-- Scripts & Maps -->
    <script src="config.js" defer></script>
    <script src="notifications.js?v=2" defer></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" crossorigin="anonymous" defer></script>

    <style>
        .chat-unread-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 12px;
            height: 12px;
            background: #e53935;
            border-radius: 50%;
            border: 2px solid var(--cr-card-bg);
            display: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .chat-unread-badge.active {
            display: block;
        }
        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
        /* Specific overrides for dashboard.html Luxe layout */
        body { background: var(--cr-bg); overflow: hidden; } /* map is background */
        #mission-map { position: fixed; inset: 0; z-index: 0; }
        
        .luxe-top-bar { position: fixed; top: 0; left: 0; right: 0; padding: 16px; display: flex; align-items: center; gap: 16px; background: linear-gradient(rgba(232, 239, 232, 0.9), transparent); z-index: 10; }
        .back-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        /* The main container for active ride info */
        #active-mission-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--cr-surface-light);
            border-radius: var(--cr-radius-xl) var(--cr-radius-xl) 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
            z-index: 20;
            padding: 24px 24px 120px 24px;
            max-height: 85vh;
            overflow-y: auto;
            transform: translateY(0);
            transition: transform 0.3s ease-out;
        }
        #active-mission-container.hidden { transform: translateY(120%); display: block !important; } /* override utility hidden for animation */
        
        .drag-handle { width: 40px; height: 4px; background: var(--cr-border-light); border-radius: 2px; margin: 0 auto 16px; }

        /* Dashboard specific fallback layout (Ride History) */
        .history-panel { position: relative; z-index: 15; padding: 80px 16px 100px; max-width: 1200px; margin: 0 auto; height: 100vh; overflow-y: auto; background: var(--cr-bg); }
        .history-panel.hidden { display: none; }
        
        .cr-stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .cr-stat-card { background: var(--cr-surface-light); border-radius: var(--cr-radius-lg); padding: 16px; box-shadow: var(--cr-shadow-sm); }
        
        .rides-table { width: 100%; display: flex; flex-direction: column; gap: 16px; }
        .rides-table tr { background: var(--cr-surface-light); border-radius: var(--cr-radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--cr-shadow-sm); }
        .rides-table td { display: flex; justify-content: space-between; font-size: 0.9rem; }
        .rides-table td::before { content: attr(data-label); font-weight: 600; color: var(--cr-text-muted); }
        .rides-table thead { display: none; }

        .btn-cancel-ride { background: var(--cr-bg); color: var(--cr-danger); border: none; padding: 8px 16px; border-radius: var(--cr-radius-pill); font-weight: 700; cursor: pointer; }
        .btn-rebook-ride { background: var(--cr-primary); color: white; border: none; padding: 8px 16px; border-radius: var(--cr-radius-pill); font-weight: 700; cursor: pointer; }
        .btn-invoice-eye { background: var(--cr-surface); border: none; padding: 8px; border-radius: 50%; color: var(--cr-primary); cursor: pointer; }

        /* CALL OVERLAY */
        #ar-calling-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 500; display: none;
            align-items: flex-end; justify-content: center;
        }
        #ar-calling-overlay.active { display: flex; animation: arFadeIn 0.2s ease; }
        @keyframes arFadeIn { from{opacity:0} to{opacity:1} }
        .ar-calling-card {
            background: var(--cr-surface-light);
            border-radius: 32px 32px 0 0;
            width: 100%; max-width: 480px;
            padding: 32px 24px 56px;
            text-align: center;
            animation: arSlideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes arSlideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
        .ar-calling-avatar-wrap { position: relative; display: inline-block; margin-bottom: 24px; }
        .ar-calling-avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid var(--cr-primary); }
        .ar-calling-ring {
            position: absolute; border-radius: 50%;
            border: 2px solid rgba(0,107,58,0.4); opacity: 0;
            animation: arRingPulse 2.4s infinite ease-out;
        }
        .ar-calling-ring:nth-child(1){inset:-10px;animation-delay:0s}
        .ar-calling-ring:nth-child(2){inset:-20px;animation-delay:0.6s}
        .ar-calling-ring:nth-child(3){inset:-30px;animation-delay:1.2s}
        @keyframes arRingPulse { 0%{opacity:0.6;transform:scale(0.9)} 100%{opacity:0;transform:scale(1.15)} }
        .ar-calling-status { font-size:0.8rem; color:var(--cr-text-muted); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; animation:arBlink 1.5s infinite; }
        @keyframes arBlink { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .ar-calling-name { font-size:1.5rem; font-weight:800; color:var(--cr-text-main); margin-bottom:6px; }
        .ar-calling-number { font-size:0.9rem; color:var(--cr-text-muted); margin-bottom:44px; }
        .ar-endcall-btn {
            width:66px; height:66px; background:#DC2626;
            border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
            cursor:pointer; border:none;
            box-shadow:0 6px 24px rgba(220,38,38,0.4);
            transition:transform 0.15s;
        }
        .ar-endcall-btn:active { transform:scale(0.88); }
        .ar-call-label { font-size:0.72rem; color:var(--cr-text-muted); margin-top:8px; font-weight:600; }
    </style>
</head>

<body>

    <!-- Splash -->

        <img src="logo.png" style="width:120px;animation:pulse 2s infinite;">

    <!-- Active Ride Top Bar -->
    <div class="luxe-top-bar" id="active-top-bar" style="display:none;">
        <div class="back-btn" onclick="document.getElementById('history-panel').classList.remove('hidden'); document.getElementById('active-top-bar').style.display='none';">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>

    <!-- Floating Map Pill -->
    <div style="position:fixed; top:80px; left:16px; z-index:10; display:none;" id="gps-tracking-pill">

    <!-- ACTIVE RIDE BOTTOM SHEET -->
    <div id="active-mission-container" class="hidden">
        <div class="drag-handle"></div>
        <div id="deviation-warning" style="display:none; background:var(--cr-accent-red); color:var(--cr-danger); padding:12px; border-radius:var(--cr-radius-sm); font-weight:600; font-size:0.85rem; margin-bottom:16px; text-align:center;">
            ⚠️ Route Deviation Detected! Fare recalculating.
        </div>

        <div id="active-details">
            <!-- JS injects content here. We will intercept/style it via global CSS overrides in JS or here -->
            <!-- The standard inject contains status, driver details, etc. -->
        </div>
    </div>

    <!-- RIDE HISTORY (Dashboard View) -->
    

    

    <!-- Support placeholder -->
    <span id="active-status" style="display:none;"></span>

    <!-- ADDITIONAL CUSTOMER MODALS -->
    <!-- Profile Modal -->
    <!-- Settings Modal -->
    <!-- Support Modal -->
    <script>
        function getTripTimerText(elapsedSecs) {
            if (elapsedSecs === undefined || elapsedSecs === null || isNaN(elapsedSecs)) return '00:00:00';
            const diff = Math.max(0, parseInt(elapsedSecs));
            const h = Math.floor(diff / 3600);
            const m = Math.floor((diff % 3600) / 60);
            const s = diff % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
        
        setInterval(() => {
            const timerEl = document.getElementById('customer-live-trip-timer');
            if (timerEl) {
                let elapsed = parseInt(timerEl.getAttribute('data-elapsed'), 10);
                if (!isNaN(elapsed)) {
                    elapsed += 1;
                    timerEl.setAttribute('data-elapsed', elapsed);
                    timerEl.textContent = getTripTimerText(elapsed);
                }
            }
        }, 1000);
        
        async function saveSettings() {
            const name = document.getElementById('settings-name').value.trim();
            const email = document.getElementById('settings-email').value.trim();
            const errEl = document.getElementById('settings-error');
            const btn = document.getElementById('settings-save-btn');
            errEl.style.display = 'none';
            if (!name) {
                errEl.textContent = 'Name cannot be empty.';
                errEl.style.display = 'block';
                return;
            }
            btn.disabled = true;
            btn.textContent = 'Saving...';
            try {
                const res = await fetch(`${API_BASE_URL}/api/user/update-profile`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ name, email })
                });
                const data = await res.json();
                if (!res.ok) {
                    errEl.textContent = data.error || 'Failed to save. Try again.';
                    errEl.style.display = 'block';
                    return;
                }
                // Update localStorage and UI
                const user = JSON.parse(localStorage.getItem('cityride_member')) || {};
                user.name = data.user.name;
                user.email = data.user.email;
                localStorage.setItem('cityride_member', JSON.stringify(user));
                const avatarUrl = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(data.user.name) + '&background=006B3A&color=fff';
                document.getElementById('nav-profile-name').textContent = data.user.name;
                document.getElementById('nav-profile-img').src = avatarUrl;
                document.getElementById('settings-avatar').src = avatarUrl;
                const userNameEl = document.getElementById('user-name');
                if (userNameEl) userNameEl.textContent = data.user.name;
                closeNavModal('settings-modal-overlay');
                Swal.fire({ title: 'Profile Updated', text: 'Your details have been saved.', icon: 'success', confirmButtonColor: '#006B3A', timer: 2000, showConfirmButton: false });
            } catch (err) {
                errEl.textContent = 'Network error. Check your connection.';
                errEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save Changes';
            }
        }
        function submitSupportTicket() {
            const msg = document.getElementById('support-message').value;
            if(!msg.trim()) {
                Swal.fire('Error', 'Please describe your issue.', 'error');
                return;
            }
            Swal.fire({
                title: 'Submitted',
                text: 'Your ticket has been submitted. Our team will contact you shortly.',
                icon: 'success',
                confirmButtonColor: '#B71C1C'
            }).then(() => {
                closeNavModal('support-modal-overlay');
                document.getElementById('support-message').value = '';
            });
        }

        function openNavModal(id) {
            const el = document.getElementById(id);
            if (el) el.classList.add('open');
            const user = JSON.parse(localStorage.getItem('cityride_member'));
            if (id === 'profile-modal-overlay' && user) {
                document.getElementById('nav-profile-name').textContent = user.name || 'User';
                document.getElementById('nav-profile-phone').textContent = user.phone || '';
                document.getElementById('nav-profile-img').src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name || 'User') + '&background=006B3A&color=fff';
            }
            if (id === 'settings-modal-overlay' && user) {
                document.getElementById('settings-name').value = user.name || '';
                document.getElementById('settings-email').value = user.email || '';
                document.getElementById('settings-phone').value = user.phone || '';
                document.getElementById('settings-avatar').src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name || 'User') + '&background=006B3A&color=fff';
                document.getElementById('settings-error').style.display = 'none';
            }
        }
        function closeNavModal(id) {
            const el = document.getElementById(id);
            if (el) el.classList.remove('open');
        }
        function navLogoutUser() {
            fetch('/api/auth/logout', { method: 'POST' }).then(() => {
                localStorage.removeItem('cityride_member');
                window.location.href = 'auth.html';
            });
        }
    </script>

    <!-- Script Overrides for Luxe Injection -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            function getPassengerWaitingTimerHtml(elapsedSecs) {
                const allowedSecs = 300; // 5 mins grace
                if (elapsedSecs <= allowedSecs) {
                    const remaining = allowedSecs - elapsedSecs;
                    const rH = Math.floor(remaining / 3600);
                    const rM = Math.floor((remaining % 3600) / 60);
                    const rS = remaining % 60;
                    const hStr = rH > 0 ? `${rH}:` : '';
                    return `<span id="passenger-waiting-timer" data-elapsed="${elapsedSecs}" style="color:var(--cr-primary); font-weight:700;">Grace: ${hStr}${String(rM).padStart(2,'0')}:${String(rS).padStart(2,'0')}</span>`;
                } else {
                    const over = elapsedSecs - allowedSecs;
                    const oH = Math.floor(over / 3600);
                    const oM = Math.floor((over % 3600) / 60);
                    const oS = over % 60;
                    const hStr = oH > 0 ? `${oH}:` : '';
                    const charge = Math.ceil(over / 60) * 2;
                    return `<span id="passenger-waiting-timer" data-elapsed="${elapsedSecs}" style="color:var(--danger-red, #B71C1C); font-weight:700;">Waiting: ${hStr}${String(oM).padStart(2,'0')}:${String(oS).padStart(2,'0')} (+₹${charge})</span>`;
                }
            }

            // Passenger waiting timer interval
            setInterval(() => {
                const timerEl = document.getElementById('passenger-waiting-timer');
                if (timerEl) {
                    let elapsedSecs = parseInt(timerEl.getAttribute('data-elapsed'), 10);
                    if (!isNaN(elapsedSecs)) {
                        elapsedSecs++;
                        timerEl.outerHTML = getPassengerWaitingTimerHtml(elapsedSecs);
                    }
                }
            }, 1000);

            // Monitor for active mission injection to restyle it on the fly
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if(mutation.target.id === 'active-details' && mutation.addedNodes.length > 0) {
                        restyleActiveDetails();
                        // document.getElementById('history-panel').classList.add('hidden');
                        document.getElementById('active-top-bar').style.display = 'flex';
                        document.getElementById('gps-tracking-pill').style.display = 'block';
                        document.getElementById('active-map-tools').style.display = 'flex';
                    }
                    if(document.getElementById('active-mission-container').classList.contains('hidden')) {
                        // document.getElementById('history-panel').classList.remove('hidden');
                        document.getElementById('active-top-bar').style.display = 'none';
                        document.getElementById('gps-tracking-pill').style.display = 'none';
                        document.getElementById('active-map-tools').style.display = 'none';
                    }
                });
            });
            const ad = document.getElementById('active-details');
            if(ad) observer.observe(ad, { childList: true, subtree: true });
            
            const cont = document.getElementById('active-mission-container');
            if(cont) observer.observe(cont, { attributes: true, attributeFilter: ['class'] });

            function restyleActiveDetails() {
                // Find driver section and reformat
                const detailsHtml = document.getElementById('active-details');
                
                // If it contains "Searching for CityRide Driver..."
                if(detailsHtml.innerHTML.includes('Searching for CityRide Driver')) {
                    detailsHtml.innerHTML = `
                        <div style="text-align:center; padding:24px 0;">
                            <div class="loader-circle"></div>
                            <div style="font-weight:700; font-size:1.1rem; margin-bottom:8px;">Finding your LuxeRide...</div>
                            <div style="font-size:0.9rem; color:var(--cr-text-muted); margin-bottom:24px;">Matching you with the highest-rated drivers nearby...</div>
                            <div style="display:flex; gap:12px; justify-content:center; margin-bottom:32px;">
                                <div style="background:var(--cr-bg); color:var(--cr-primary); padding:6px 12px; border-radius:var(--cr-radius-pill); font-size:0.8rem; font-weight:600; display:flex; align-items:center; gap:6px;">✓ Top Rated Only</div>
                                <div style="background:#DBEAFE; color:var(--cr-accent-blue); padding:6px 12px; border-radius:var(--cr-radius-pill); font-size:0.8rem; font-weight:600; display:flex; align-items:center; gap:6px;">🚗 Green Choice</div>
                            </div>
                            <button onclick="document.querySelector('#hidden-cancel button')?.click()" class="cr-btn cr-btn-light" style="width:100%; border:1px solid var(--cr-border-light); font-weight:600; color:var(--cr-text-main);">✕ Cancel Booking</button>
                            <button onclick="window.location.href='dashboard.html'" class="cr-btn cr-btn-light" style="width:100%; margin-top:12px; border:none; font-weight:600; color:var(--cr-text-muted); background:transparent; box-shadow:none;">← Back to Dashboard</button>
                        </div>
                        <div style="display:none;" id="hidden-cancel">
                            ${detailsHtml.querySelector('button[onclick*="cancelRide"]')?.outerHTML || ''}
                        </div>
                    `;
                    return;
                }
                
                // Break the MutationObserver infinite loop if already restyled
                if (detailsHtml.innerHTML.includes('driver-card-luxe')) return;
                
                // If assigned or ongoing
                const am = window._currentActiveMission;
                if (am && (am.status === 'assigned' || am.status === 'ongoing')) {
                    const otp = am.journey_otp || '----';
                    const driverName = am.driver_name || 'Driver';
                    const carModel = am.car_model || 'Premium Vehicle';
                    const carNumber = am.car_number || 'TBD';
                    let driverPhone = am.driver_phone || '';
                    if (driverPhone && !driverPhone.startsWith('tel:')) driverPhone = 'tel:' + driverPhone;
                    
                    const currentBookingId = am.id;
                    window._activeBookingId = currentBookingId;
                    if (window._rtcSocket && currentBookingId) {
                        window._rtcSocket.bookingIdContext = currentBookingId;
                        window._rtcSocket.emit('track_booking', currentBookingId);
                    }
                    
                    let etaText = am.estimated_duration ? `Arrival in ${am.estimated_duration}` : 'Arrival Pending';
                    const distVal = am.actual_distance || am.estimated_distance || am.distance || 'Unknown';
                    const distText = distVal === 'Unknown' ? distVal : `${distVal} trip`;
                    let subText = `<span style="color:var(--cr-primary);">ON TIME</span> • ${distText}`;
                    
                    let otpBlock = ``;
                    if (am.status === 'assigned' && am.reached_pickup_time) {
                        etaText = 'Driver Arrived';
                        const elapsed = am.reached_elapsed_seconds || 0;
                        subText = getPassengerWaitingTimerHtml(elapsed);
                        otpBlock = `
                            <div class="ar-otp-badge">
                                <div class="otp-label">YOUR OTP</div>
                                <div class="otp-val">${otp}</div>
                            </div>
                        `;
                    } else if (am.status === 'assigned') {
                        otpBlock = `
                            <div class="ar-otp-badge">
                                <div class="otp-label">YOUR OTP</div>
                                <div class="otp-val">${otp}</div>
                            </div>
                        `;
                    } else if (am.status === 'ongoing') {
                        etaText = 'On Trip';
                        subText = `<span style="color:var(--cr-primary);">En route to destination</span>`;
                    }

                    const pickup = am.pickup_loc || 'Pickup Location';
                    const dropoff = am.drop_loc || 'Dropoff Location';
                    const estFare = am.estimated_price || '0';
                    const liveFare = am.live_fare || '0';

                    detailsHtml.innerHTML = `
                        <div class="flex-between" style="margin-bottom:16px;">
                            <div>
                                <div class="ar-eta">${etaText}</div>
                                <div style="font-size:0.85rem; color:var(--cr-text-muted); font-weight:600;">${subText}</div>
                            </div>
                            ${otpBlock}
                        </div>
                        
                        <div style="background:var(--cr-bg); padding:12px; border-radius:12px; margin-bottom:16px;">
                            <div style="display:flex; align-items:start; gap:8px; margin-bottom:8px;">
                                <div style="width:8px; height:8px; border-radius:50%; background:var(--cr-primary); margin-top:6px; flex-shrink:0;"></div>
                                <div style="font-size:0.85rem; color:var(--cr-text-main); font-weight:500; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;" title="${pickup}">${pickup}</div>
                            </div>
                            <div style="display:flex; align-items:start; gap:8px;">
                                <div style="width:8px; height:8px; border-radius:0; background:var(--cr-accent-red); margin-top:6px; flex-shrink:0;"></div>
                                <div style="font-size:0.85rem; color:var(--cr-text-main); font-weight:500; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;" title="${dropoff}">${dropoff}</div>
                            </div>
                        </div>
                        
                        <div class="flex-between" style="background:var(--cr-bg); padding:12px; border-radius:12px; margin-bottom:16px; display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:4px;">
                            <div style="text-align:left;">
                                <div style="font-size:0.7rem; color:var(--cr-text-muted); font-weight:600; text-transform:uppercase;">Live Fare</div>
                                <div id="customer-live-fare" style="font-size:1.0rem; color:var(--cr-text-main); font-weight:700;">₹${liveFare}</div>
                            </div>

async function playReachedSoundFor5Seconds() {
    try {
        if (!dashboardAudioCtx) return;
        if (dashboardAudioCtx.state === 'suspended') {
            try { await dashboardAudioCtx.resume(); } catch(e) { console.warn('Audio blocked:', e); }
        }
        if (dashboardAudioCtx.state === 'suspended') return;
        let beeps = 0;
        const interval = setInterval(() => {
            if (beeps >= 5) {
                clearInterval(interval);
                return;
            }
            beeps++;
            const osc = dashboardAudioCtx.createOscillator();
            const gain = dashboardAudioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, dashboardAudioCtx.currentTime); // distinct pitch
            gain.gain.setValueAtTime(0.15, dashboardAudioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, dashboardAudioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(dashboardAudioCtx.destination);
            osc.start();
            osc.stop(dashboardAudioCtx.currentTime + 0.6);
        }, 1000);
    } catch(e) {}
}

/**
 * Initialize Socket.IO for the Customer Dashboard.
 * Socket events trigger existing poll functions immediately.
 * setInterval polling remains as reliable fallback.
 */
function initUserSocket(user) {
    if (typeof io === 'undefined') return;

    const raw = localStorage.getItem('cityride_member');
    let parsed = null;
    try { parsed = raw ? JSON.parse(raw) : null; } catch (e) {}

    const userSocket = io({
        auth: { token: parsed?.token || '' },
        transports: ['websocket', 'polling'],
        reconnectionDelay: 2000,
        reconnectionAttempts: 20
    });

    userSocket.on('connect', () => {
        console.log('[Socket.IO] Customer connected:', userSocket.id);
    });

    userSocket.on('disconnect', (reason) => {
        console.warn('[Socket.IO] Customer disconnected:', reason);
    });

    // --- WebRTC Setup ---
    if (typeof attachWebRTCSocketListeners === 'function') {
        attachWebRTCSocketListeners(
            userSocket, 
            'user', 
            (callerName, offer) => {
                showCallOverlay(null, callerName, true);
            },
            () => {
                const overlay = document.getElementById('ar-calling-overlay');
                if (overlay) overlay.classList.remove('active');
            }
        );
    }

    // Booking status changed (assigned, ongoing, finished, cancelled) — notify & refresh immediately
    userSocket.on('booking_status_update', (data) => {
        if (window.CustomerNotifications) {
            window.CustomerNotifications.processSocketActivity(data);
        }
        if (typeof loadDashboardData === 'function') loadDashboardData(user);
    });

    // Driver confirmed — notify & refresh booking list immediately
    userSocket.on('booking_confirmed', (data) => {
        if (window.CustomerNotifications) {
            window.CustomerNotifications.processSocketActivity({ ...data, status: 'assigned' });
        }
        if (typeof loadDashboardData === 'function') loadDashboardData(user);
    });

    // Booking created
    userSocket.on('booking_created', (data) => {
        if (window.CustomerNotifications) {
            window.CustomerNotifications.processSocketActivity({ ...data, status: 'pending' });
        }
        if (typeof loadDashboardData === 'function') loadDashboardData(user);
    });

    // Chat Message Notification
    userSocket.on('chat_notification', (data) => {
        if (window.CustomerNotifications) {
            window.CustomerNotifications.showToast('chat', null, `${data.senderName}: ${data.message}`);
        }
        const badge = document.getElementById('chat-unread-badge');
        if (badge) badge.classList.add('active');
    });

    // Live driver GPS location pushed from server — update map immediately
    userSocket.on('driver_location', (data) => {
        if (data && data.latitude && data.longitude) {
            if (typeof updateDriverMarkerOnMap === 'function') {
                updateDriverMarkerOnMap(data.latitude, data.longitude);
            }
        }
        if (data && data.actualDistance) {
            const distEl = document.getElementById('customer-live-distance');
            if (distEl) distEl.textContent = data.actualDistance;
            
            // Also update the active mission object so it persists across re-renders
            if (window._currentActiveMission) {
                window._currentActiveMission.actual_distance = data.actualDistance;
            }
        }
        if (data && data.newFare) {
            const fareEl = document.getElementById('customer-live-fare');
            if (fareEl) fareEl.textContent = `₹${data.newFare}`;
            
            if (window._currentActiveMission) {
                window._currentActiveMission.live_fare = data.newFare;
            }
        }
    });
}

async function cancelRide(bookingId, userId) {

}

loadDashboardData(user);
} else {
if (result.banned) {
showBanBanner(result.banned_until);
}
alert(' ' + result.error);
}
} catch (err) {

}
}

const hrs = Math.floor(diff / 3600000);
const mins = Math.floor((diff % 3600000) / 60000);
document.getElementById('ban-countdown').textContent =
` Suspension lifts in: ${hrs}h ${mins}m`;
}

                    ${(trip.trip_type !== 'local' && trip.start_odometer) ? `
                    <div style="background:rgba(10,132,255,0.05); border:1px solid rgba(10,132,255,0.2); border-radius:12px; padding:1rem; margin-bottom:1.5rem;">
                        <div style="font-weight:800; font-size:0.75rem; color:#0a84ff; margin-bottom:0.8rem; text-transform:uppercase; letter-spacing:1px;">Odometer Readings</div>
                        <div style="display:flex; justify-content:space-between; margin-bottom:0.4rem; font-size:0.9rem;">
                            <span style="color:var(--text-muted);">Opening</span>
                            <span style="font-weight:700;">${trip.start_odometer}</span>
                        </div>
                        ${trip.end_odometer ? `
                        <div style="display:flex; justify-content:space-between; font-size:0.9rem;">
                            <span style="color:var(--text-muted);">Closing</span>
                            <span style="font-weight:700;">${trip.end_odometer}</span>
                        </div>
                        ` : ''}
                    </div>
                    ` : ''}

                    ${fareBreakdownHtml}
                    
                </div>
            `,
            background: '#14161d',
            color: '#fff',
            customClass: { popup: 'premium-invoice-modal' },
            showCloseButton: true,
            showConfirmButton: false,
            showCancelButton: true,
            cancelButtonText: 'Close',
            cancelButtonColor: 'rgba(255,255,255,0.1)',
            width: '450px'
        });
}</script>

    <script src="/socket.io/socket.io.js"></script>

    <script>
    // ─── SHARE TRIP ───
    function shareTrip(bookingId) {
        const text = `I'm on my way! Tracking my CityRide trip #B${bookingId}. 🚖`;
        if (navigator.share) {
            navigator.share({ title: 'CityRide Trip', text }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text).then(() => {
                if (window.Swal) Swal.fire({ title: 'Copied!', text: 'Trip info copied to clipboard.', icon: 'success', timer: 1500, showConfirmButton: false });
                else alert('Copied to clipboard!');
            }).catch(() => {});
        }
    }

    // ─── SOS ───
    function triggerSOS() {
        if (window.Swal) {
            Swal.fire({
                title: '🆘 Emergency SOS',
                html: '<div style="text-align:left;font-size:0.9rem;"><b>Call Emergency Services:</b><br><a href="tel:112" style="color:#DC2626;font-weight:700;font-size:1.1rem;">📞 112 — Emergency</a><br><br><b>Share your trip info:</b><br>Your driver and trip details are logged in the system.</div>',
                confirmButtonText: 'Call 112',
                confirmButtonColor: '#DC2626',
                showCancelButton: true,
                cancelButtonText: 'Close'
            }).then(r => { if (r.isConfirmed) window.location.href = 'tel:112'; });
        } else {
            if (confirm('Call emergency services (112)?')) window.location.href = 'tel:112';
        }
    }
    </script>
