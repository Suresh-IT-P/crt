<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CityRideTaxi | In-Ride Chat</title>
    <meta name="description" content="Chat with your driver during your CityRide taxi trip.">
    <link rel="icon" type="image/png" href="car.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="customer.css?v=2">
    <script src="config.js"></script>
    <style>
        :root {
            --chat-self-bg: #006B3A;
            --chat-self-text: #ffffff;
            --chat-other-bg: #ffffff;
            --chat-other-text: #1C2B23;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--cr-bg);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* TOP BAR */
        .chat-header {
            background: var(--cr-surface-light);
            border-bottom: 1px solid var(--cr-border-light);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .chat-back-btn {
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            background: var(--cr-bg);
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .chat-back-btn:active { background: var(--cr-border-light); }
        .chat-driver-avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--cr-primary);
            flex-shrink: 0;
        }
        .chat-driver-info { flex: 1; min-width: 0; }
        .chat-driver-name {
            font-weight: 700; font-size: 1rem;
            color: var(--cr-text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .chat-driver-sub {
            font-size: 0.75rem; color: var(--cr-text-muted);
            display: flex; align-items: center; gap: 6px; margin-top: 1px;
        }
        .chat-online-dot {
            width: 7px; height: 7px;
            background: #22C55E; border-radius: 50%;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .chat-call-btn {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #22C55E, #006B3A);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: none;
            box-shadow: 0 4px 12px rgba(0,107,58,0.35);
            transition: transform 0.15s;
            flex-shrink: 0;
        }
        .chat-call-btn:active { transform: scale(0.9); }

        /* MESSAGES */
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }
        #chat-messages::-webkit-scrollbar { width: 0; }
        .msg-row { display: flex; align-items: flex-end; gap: 8px; animation: fadeUp 0.22s ease-out; }
        .msg-row.self { flex-direction: row-reverse; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        .msg-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1.5px solid var(--cr-border-light); }
        .msg-bubble {
            max-width: 72%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.9rem;
            line-height: 1.45;
            word-break: break-word;
        }
        .msg-row.other .msg-bubble {
            background: var(--chat-other-bg); color: var(--chat-other-text);
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .msg-row.self .msg-bubble {
            background: var(--chat-self-bg); color: var(--chat-self-text);
            border-bottom-right-radius: 4px;
        }
        .msg-time { font-size: 0.65rem; opacity: 0.55; margin-top: 3px; display: block; text-align: right; }
        .msg-row.other .msg-time { text-align: left; }

        /* TYPING */
        #typing-indicator { display: none; align-items: flex-end; gap: 8px; }
        .typing-bubble {
            background: white; border-radius: 18px; border-bottom-left-radius: 4px;
            padding: 10px 16px; display: flex; gap: 5px; align-items: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
        }
        .typing-dot { width: 7px; height: 7px; background: var(--cr-text-muted); border-radius: 50%; animation: typingBounce 1.2s infinite; }
        .typing-dot:nth-child(2){animation-delay:0.2s} .typing-dot:nth-child(3){animation-delay:0.4s}
        @keyframes typingBounce { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-5px);opacity:1} }

        /* EMPTY STATE */
        #chat-empty {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 12px; color: var(--cr-text-muted);
            padding: 60px 40px; flex: 1;
        }
        .empty-icon { width: 70px; height: 70px; background: var(--cr-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        /* QUICK CHIPS */
        .quick-chips {
            display: flex; gap: 8px; overflow-x: auto;
            padding: 8px 16px 0; background: var(--cr-surface-light);
            scrollbar-width: none;
        }
        .quick-chips::-webkit-scrollbar{display:none}
        .chip {
            white-space: nowrap; background: var(--cr-bg);
            border: 1px solid var(--cr-border-light); border-radius: 99px;
            padding: 6px 14px; font-size: 0.78rem; font-weight: 600;
            color: var(--cr-text-main); cursor: pointer; flex-shrink: 0;
            transition: background 0.15s, color 0.15s;
        }
        .chip:active { background: var(--cr-primary); color: white; border-color: var(--cr-primary); }

        /* COMPOSER */
        .chat-composer {
            background: var(--cr-surface-light);
            border-top: 1px solid var(--cr-border-light);
            padding: 10px 16px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            display: flex; align-items: center; gap: 10px;
        }
        .composer-input-wrap {
            flex: 1; background: var(--cr-bg); border-radius: 24px;
            border: 1.5px solid var(--cr-border-light);
            display: flex; align-items: center; padding: 0 14px;
            transition: border-color 0.2s;
        }
        .composer-input-wrap:focus-within { border-color: var(--cr-primary); }
        #msg-input {
            flex: 1; background: transparent; border: none; outline: none;
            font-family: 'Inter', sans-serif; font-size: 0.9rem;
            color: var(--cr-text-main); padding: 12px 0;
            resize: none; max-height: 100px;
        }
        #msg-input::placeholder { color: var(--cr-text-muted); }
        .send-btn {
            width: 44px; height: 44px; background: var(--cr-primary);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: none;
            box-shadow: 0 4px 12px rgba(0,107,58,0.25);
            transition: transform 0.15s, background 0.2s; flex-shrink: 0;
        }
        .send-btn:disabled { background: #ccc; box-shadow: none; cursor: default; }
        .send-btn:not(:disabled):active { transform: scale(0.9); }

        /* CALLING OVERLAY */
        #calling-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 200; display: none;
            align-items: flex-end; justify-content: center;
        }
        #calling-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        .calling-card {
            background: var(--cr-surface-light);
            border-radius: 32px 32px 0 0;
            width: 100%; max-width: 480px;
            padding: 32px 24px 56px;
            text-align: center;
            animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
        .calling-avatar-wrap { position: relative; display: inline-block; margin-bottom: 24px; }
        .calling-avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--cr-primary); }
        .calling-ring {
            position: absolute; border-radius: 50%;
            border: 2px solid rgba(0,107,58,0.4);
            opacity: 0;
            animation: ringPulse 2.4s infinite ease-out;
        }
        .calling-ring:nth-child(1) { inset: -10px; animation-delay: 0s; }
        .calling-ring:nth-child(2) { inset: -20px; animation-delay: 0.6s; }
        .calling-ring:nth-child(3) { inset: -30px; animation-delay: 1.2s; }
        @keyframes ringPulse { 0%{opacity:0.7;transform:scale(0.9)} 100%{opacity:0;transform:scale(1.15)} }
        .calling-status { font-size: 0.82rem; color: var(--cr-text-muted); font-weight: 600; margin-bottom: 4px; letter-spacing: 0.5px; text-transform: uppercase; animation: blinkText 1.5s infinite; }
        @keyframes blinkText { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .calling-name { font-size: 1.6rem; font-weight: 800; color: var(--cr-text-main); margin-bottom: 6px; }
        .calling-number { font-size: 0.9rem; color: var(--cr-text-muted); margin-bottom: 48px; }
        .endcall-btn {
            width: 68px; height: 68px; background: #DC2626;
            border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer; border: none;
            box-shadow: 0 6px 24px rgba(220,38,38,0.4);
            transition: transform 0.15s;
        }
        .endcall-btn:active { transform: scale(0.88); }
        .call-action-label { font-size: 0.72rem; color: var(--cr-text-muted); margin-top: 8px; font-weight: 600; }
    </style>
</head>
<body>



<!-- HEADER -->
<div class="chat-header">
    <div class="chat-back-btn" onclick="history.back()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <img id="header-avatar" class="chat-driver-avatar" src="" alt="Driver">
    <div class="chat-driver-info">
        <div class="chat-driver-name" id="header-driver-name">Driver</div>
        <div class="chat-driver-sub">
            <div class="chat-online-dot"></div>
            <span id="header-driver-sub">On your trip</span>
        </div>
    </div>
    <button class="chat-call-btn" onclick="startCall()" title="Call Driver">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
            <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.01L6.6 10.8z"/>
        </svg>
    </button>
</div>

<!-- MESSAGES -->
<div id="chat-messages">
    <div id="chat-empty">
        <div class="empty-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--cr-primary)" stroke-width="1.5">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
        </div>
        <div style="font-weight:700;font-size:1rem;color:var(--cr-text-main)">Start the conversation</div>
        <div style="font-size:0.83rem;text-align:center;max-width:220px;line-height:1.5">Messages are only shared with your driver and are private to this trip.</div>
    </div>
    <div id="typing-indicator">
        <img id="typing-avatar" src="" class="msg-avatar" alt="Driver">
        <div class="typing-bubble">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>
    </div>
</div>

<!-- QUICK CHIPS -->
<div class="quick-chips">
    <div class="chip" onclick="sendQuick(`I'm on my way 🚶`)">I'm on my way 🚶</div>
    <div class="chip" onclick="sendQuick('Please wait a moment')">Please wait a moment</div>
    <div class="chip" onclick="sendQuick('Where are you now?')">Where are you now?</div>
    <div class="chip" onclick="sendQuick(`I'm at the pickup point`)">I'm at the pickup</div>
    <div class="chip" onclick="sendQuick('OK, thank you!')">OK, thanks!</div>
    <div class="chip" onclick="sendQuick('Can you call me?')">Can you call me?</div>
</div>

<!-- COMPOSER -->
<div class="chat-composer">
    <div class="composer-input-wrap">
        <textarea id="msg-input" placeholder="Type a message..." rows="1" maxlength="500"></textarea>
    </div>
    <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
    </button>
</div>

<!-- socket.io MUST load before the script block below -->
<script src="/socket.io/socket.io.js"></script>
<script>
// ─── PARAMS ───
const params = new URLSearchParams(window.location.search);
const bookingId     = params.get('bookingId');
const driverName    = params.get('driverName')    || 'Driver';
const driverPhone   = params.get('driverPhone')   || '';
const driverCar     = params.get('driverCar')     || ''; // passenger name when opened by driver
const passengerName = params.get('passengerName') || driverCar || 'Passenger';
const senderRole    = params.get('senderRole')    || 'user'; // 'user' or 'driver'

// Resolve my identity
let currentUser = null;
let myName = 'You';
if (senderRole === 'driver') {
    // Driver uses 'cityride_pilot' key
    const raw = localStorage.getItem('cityride_pilot');
    try { currentUser = raw ? JSON.parse(raw) : null; } catch(e) {}
    myName = currentUser?.name || driverName || 'Driver';
} else {
    try { currentUser = JSON.parse(localStorage.getItem('cityride_member') || 'null'); } catch(e) {}
    myName = currentUser?.name || 'You';
}

const avatarUrl = name => `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=006B3A&color=fff&size=80`;
// Who is "the other person" in the chat?
const otherLabel     = senderRole === 'driver' ? passengerName : driverName;
const otherAvatarUrl = senderRole === 'driver'
    ? `https://ui-avatars.com/api/?name=${encodeURIComponent(passengerName)}&background=2563EB&color=fff&size=80`
    : `https://ui-avatars.com/api/?name=${encodeURIComponent(driverName)}&background=2563EB&color=fff&size=80`;

// ─── POPULATE HEADER ───
document.getElementById('header-driver-name').textContent = otherLabel;
document.getElementById('header-avatar').src = otherAvatarUrl;
document.getElementById('typing-avatar').src = otherAvatarUrl;
document.getElementById('header-driver-sub').textContent =
    senderRole === 'driver' ? 'Active Trip · Passenger' : `${driverCar || 'Driver'} · Active Trip`;

// ─── SOCKET.IO ───
let socket = null;

function connectSocket() {
    if (typeof io === 'undefined' || socket) return; // skip if already connected or io not loaded

    // Get the right token
    let token = '';
    if (senderRole === 'driver') {
        const raw = localStorage.getItem('cityride_pilot');
        let parsed = null;
        try { parsed = raw ? JSON.parse(raw) : null; } catch(e) {}
        token = parsed?.token || (typeof parsed === 'string' ? parsed : '') || raw || '';
    } else {
        const raw = localStorage.getItem('cityride_member');
        let parsed = null;
        try { parsed = raw ? JSON.parse(raw) : null; } catch(e) {}
        token = parsed?.token || '';
    }

    socket = io({
        auth: { token },
        transports: ['websocket', 'polling'],
        reconnectionDelay: 1500
    });

    socket.on('connect', () => {
        console.log('[Chat] Socket connected:', socket.id);
        if (bookingId) socket.emit('track_booking', bookingId);
    });

    socket.on('connect_error', (err) => {
        console.warn('[Chat] Socket connect error:', err.message);
    });

    socket.on('chat_message', (data) => {
        if (String(data.bookingId) !== String(bookingId)) return;
        hideTyping();
        appendMessage({ text: data.message, senderName: data.senderName, isSelf: false, timestamp: data.timestamp });
        
        // Play notification sound
        try {
            new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play();
        } catch(e) {}
    });

    socket.on('chat_typing', (data) => {
        // Only show typing indicator from the OTHER side
        if (data.senderRole !== senderRole) showTyping();
    });
}

// ─── INPUT HANDLING ───
const msgInput = document.getElementById('msg-input');
const msgSendBtn = document.getElementById('send-btn');
let typingTimer = null;

msgInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    msgSendBtn.disabled = !this.value.trim();

    if (socket && bookingId) socket.emit('chat_typing', { bookingId, senderRole: 'user' });
    clearTimeout(typingTimer);
    typingTimer = setTimeout(hideTyping, 2500);
});

msgInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ─── SEND ───
function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !bookingId) return;

    const timestamp = Date.now();
    appendMessage({ text, senderName: myName, isSelf: true, timestamp });

    if (socket) {
        socket.emit('chat_message', { bookingId, message: text, senderName: myName, senderRole, timestamp });
    }

    msgInput.value = '';
    msgInput.style.height = 'auto';
    msgSendBtn.disabled = true;
}

function sendQuick(text) {
    msgInput.value = text;
    msgSendBtn.disabled = false;
    sendMessage();
}

// ─── RENDER MESSAGE ───
function appendMessage({ text, senderName, isSelf, timestamp }) {
    document.getElementById('chat-empty').style.display = 'none';
    const container = document.getElementById('chat-messages');
    const typingEl = document.getElementById('typing-indicator');
    const timeStr = new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const src = isSelf ? avatarUrl(myName) : otherAvatarUrl;

    const row = document.createElement('div');
    row.className = `msg-row ${isSelf ? 'self' : 'other'}`;
    row.innerHTML = `
        <img src="${src}" class="msg-avatar" alt="${esc(senderName)}">
        <div>
            <div class="msg-bubble">
                ${esc(text).replace(/\n/g,'<br>')}
                <span class="msg-time">${timeStr}</span>
            </div>
        </div>`;
    container.insertBefore(row, typingEl);
    container.scrollTop = container.scrollHeight;
}

function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── TYPING ───
let typingTimeout = null;
function showTyping() {
    document.getElementById('typing-indicator').style.display = 'flex';
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(hideTyping, 3000);
    document.getElementById('chat-messages').scrollTop = 999999;
}
function hideTyping() {
    document.getElementById('typing-indicator').style.display = 'none';
}

// ─── CALL ───
function startCall() {
    if (driverPhone) window.location.href = `tel:${driverPhone}`;
}

// ─── LOAD CHAT HISTORY ───
async function loadChatHistory() {
    if (!bookingId) return;
    try {
        const res = await fetch(`/api/bookings/${bookingId}/chat`);
        const data = await res.json();
        if (data.success && data.messages.length > 0) {
            data.messages.forEach(msg => {
                appendMessage({
                    text: msg.message,
                    senderName: msg.sender_name,
                    isSelf: msg.sender_role === senderRole,
                    timestamp: msg.created_at
                });
            });
        }
    } catch (e) {
        console.error('Failed to load chat history', e);
    }
}

// ─── BOOT ───
connectSocket();
loadChatHistory();
</script>
</body>
</html>
